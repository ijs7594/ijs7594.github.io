<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />

  <title>教育訓練 · 今年貴焿助理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brown-dark:  #2C1A0E;
      --brown-mid:   #5C3317;
      --brown-main:  #8B5E3C;
      --caramel:     #C17B4E;
      --sand:        #D4A574;
      --cream:       #F5EDE0;
      --warm-white:  #FAF7F2;
      --card-bg:     #FFFFFF;
      --text-dark:   #2C1A0E;
      --text-mid:    #6B4C35;
      --text-light:  #9E7B60;
      --border:      #EDE0D0;
      --green:       #4CAF7D;
    }

    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--warm-white);
      color: var(--text-dark);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar { width: 200px; min-width: 200px; background: var(--brown-dark); display: flex; flex-direction: column; padding: 20px 0; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .avatar-sq { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, var(--caramel), var(--brown-main)); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .brand-text { color: #fff; }
    .brand-name { font-size: 14px; font-weight: 600; }
    .brand-sub  { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 1px; }
    .nav-list { display: flex; flex-direction: column; gap: 2px; padding: 16px 8px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: rgba(255,255,255,0.55); font-size: 13px; transition: background 0.15s; }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
    .nav-item.active { background: rgba(255,255,255,0.13); color: #fff; }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-text { font-weight: 500; font-size: 13px; }
    .nav-sub  { font-size: 10px; color: rgba(255,255,255,0.35); }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar-icon { font-size: 22px; }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text-dark); }
    .topbar-sub { font-size: 12px; color: var(--text-light); }
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    .group-label { font-size: 12px; font-weight: 700; color: var(--brown-mid); margin: 4px 0 12px; }

    .article-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
    .article-card {
      display: flex; align-items: center; gap: 16px;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 20px; text-decoration: none; color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    .article-card:hover { border-color: var(--caramel); transform: translateY(-1px); }
    .article-icon {
      width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
      background: var(--cream); display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .article-title { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 3px; }
    .article-desc { font-size: 12.5px; color: var(--text-light); }
    .article-arrow { margin-left: auto; color: var(--text-light); font-size: 14px; flex-shrink: 0; }

    .empty-note { font-size: 13px; color: var(--text-light); padding: 20px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; }

    /* ── Mobile ── */
    .mobile-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--brown-dark);
      border-top: 1px solid rgba(255,255,255,0.1);
      height: 60px;
      justify-content: space-around; align-items: center;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .mobile-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      text-decoration: none; color: rgba(255,255,255,0.45); font-size: 10px;
      flex: 1; padding: 6px 4px;
    }
    .mobile-nav-item.active { color: #fff; }
    .mobile-nav-item .mn-icon { font-size: 20px; line-height: 1; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .content { padding-bottom: 80px !important; }
      .mobile-nav { display: flex; }
    }
  </style>
</head>
