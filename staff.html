<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>今年貴焿 · 夥伴入口</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --brown:   #2C1A0E;
      --caramel: #C17B4E;
      --seal:    #C8102E;
      --cream:   #F5EDE0;
      --bg:      #F2EDE7;
      --card:    #FFFFFF;
      --border:  rgba(0,0,0,0.06);
      --text:    #1A1A1A;
      --sub:     #888;
    }

    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .app-header {
      background: var(--card);
      padding: 56px 32px 36px;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
      box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 8px 24px rgba(44,26,14,0.05);
    }
    .app-logo-img {
      width: 100%; max-width: 280px; height: auto; display: block;
    }
    .app-sub {
      font-size: 10px; color: var(--sub); font-weight: 600;
      letter-spacing: 3px; margin-top: 22px;
      display: flex; align-items: center; gap: 10px;
    }
    .app-sub::before, .app-sub::after {
      content: ""; width: 16px; height: 1px; background: var(--border);
    }

    /* ── Section ── */
    .section { margin: 16px 14px 0; }
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--sub);
      letter-spacing: 1px; padding: 0 6px 8px;
    }

    /* ── Menu List ── */
    .menu-list {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .menu-item {
      display: flex; align-items: center; gap: 14px;
      padding: 15px 16px;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
      position: relative;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: #f7f4f1; }

    .menu-icon {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
    }
    .menu-icon.orange { background: #FFF0E6; }
    .menu-icon.green  { background: #E8F7EF; }
    .menu-icon.blue   { background: #E8F0FE; }
    .menu-icon.amber  { background: #FFF8E1; }
    .menu-icon.brown  { background: var(--cream); }

    .menu-text { flex: 1; }
    .menu-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .menu-desc { font-size: 12px; color: var(--sub); }

    .menu-arrow { font-size: 14px; color: #C0C0C0; flex-shrink: 0; }

    /* ── Notice Banner ── */
    .notice-banner {
      margin: 14px 14px 0;
      background: var(--card);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex; align-items: flex-start; gap: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .notice-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .notice-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .notice-body  { font-size: 12px; color: var(--sub); line-height: 1.6; }

    /* ── Footer ── */
    .footer {
      text-align: center; padding: 28px 20px 36px;
      font-size: 11px; color: var(--sub);
    }
    .footer span { color: var(--caramel); font-weight: 600; }

    /* ── 門店選擇關卡 ── */
    .store-gate {
      position: fixed; inset: 0; background: var(--brown);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 20px;
    }
    .store-gate-box {
      background: var(--card); border-radius: 18px;
      padding: 32px 24px; width: 100%; max-width: 380px;
      text-align: center;
    }
    .store-gate-title { font-size: 17px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
    .store-gate-sub { font-size: 12px; color: var(--sub); margin-bottom: 20px; }
    .store-gate-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
    .store-gate-btn {
      padding: 13px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--bg); font-size: 14px; font-weight: 700; color: var(--text);
      cursor: pointer; text-align: left; font-family: inherit;
    }
    .store-gate-btn:active { background: #eee; }

    /* ── 目前門店列 ── */
    .current-store-bar {
      margin: 14px 14px 0;
      background: var(--card); border-radius: 14px;
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .current-store-label { font-size: 11px; color: var(--sub); }
    .current-store-name { font-size: 15px; font-weight: 800; color: var(--seal); }
    .switch-store-btn {
      font-size: 12px; color: var(--sub); background: none; border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 12px; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>

<div class="store-gate" id="store-gate" style="display:none;">
  <div class="store-gate-box">
    <img class="app-logo-img" src="assets/logo.png" alt="今年貴焿" style="max-width:220px;margin-bottom:12px;" />
    <div class="store-gate-title">請選擇你的門店</div>
    <div class="store-gate-sub">選過一次，這台裝置以後會自動記得</div>
    <div class="store-gate-list" id="store-gate-list"></div>
  </div>
</div>

<!-- Header -->
<div class="app-header">
  <img class="app-logo-img" src="assets/logo.png" alt="今年貴焿" />
  <div class="app-sub">夥伴互動入口</div>
</div>

<div class="current-store-bar" id="current-store-bar" style="display:none;">
  <div>
    <div class="current-store-label">目前門店</div>
    <div class="current-store-name" id="current-store-name">—</div>
  </div>
  <button class="switch-store-btn" onclick="openStoreGate()">切換</button>
</div>

<!-- 日常工具 -->
<div class="section">
  <div class="section-label">日常工具</div>
  <div class="menu-list">

    <a class="menu-item" href="training.html?from=staff">
      <div class="menu-icon orange">🎓</div>
      <div class="menu-text">
        <div class="menu-name">教育訓練</div>
        <div class="menu-desc">公安食安 · SOP · 管理技能</div>
      </div>
      <div class="menu-arrow">›</div>
    </a>

    <a class="menu-item" href="finance-hub.html?from=staff" id="link-finance">
      <div class="menu-icon blue">📆</div>
      <div class="menu-text">
        <div class="menu-name">營收帳務</div>
        <div class="menu-desc">日報表 · 應收應付與毛利</div>
      </div>
      <div class="menu-arrow">›</div>
    </a>

  </div>
</div>

<!-- Notice -->
<div class="notice-banner">
  <div class="notice-icon">🙏</div>
  <div>
    <div class="notice-title">排假提醒</div>
    <div class="notice-body">每月 18 號前請完成排假申請，感謝夥伴們互相成就。</div>
  </div>
</div>

<div class="footer">
  今年貴焿古早味麵線羹<br />
  <span>使人和睦的人有福了。</span>
</div>

<script>
  const SUPABASE_URL = 'https://zsowgiobylacwabjjvub.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzb3dnaW9ieWxhY3dhYmpqdnViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Mzg4NDMsImV4cCI6MjA5OTUxNDg0M30.SvAd1SgRl1oAt4wNTPuXHeiP4omRcFAb-S8DY5EJvEw';

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let stores = [];

  async function initStoreGate() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stores?select=id,name,status&order=created_at.asc`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    let allStores = await res.json();
    if (!Array.isArray(allStores)) allStores = [];
    stores = allStores.filter(s => s.status === '營運中');

    const savedId = localStorage.getItem('staff_store_id');
    const savedName = localStorage.getItem('staff_store_name');
    const stillValid = savedId && stores.some(s => s.id === savedId);

    if (stillValid) {
      applyStore(savedId, savedName);
    } else {
      openStoreGate();
    }
  }

  function openStoreGate() {
    const list = document.getElementById('store-gate-list');
    list.innerHTML = stores.map(s =>
      `<button class="store-gate-btn" onclick="pickStore('${s.id}', '${esc(s.name)}')">${esc(s.name)}</button>`
    ).join('');
    document.getElementById('store-gate').style.display = 'flex';
  }

  function pickStore(id, name) {
    localStorage.setItem('staff_store_id', id);
    localStorage.setItem('staff_store_name', name);
    document.getElementById('store-gate').style.display = 'none';
    applyStore(id, name);
  }

  function applyStore(id, name) {
    document.getElementById('current-store-bar').style.display = 'flex';
    document.getElementById('current-store-name').textContent = name;
    ['link-finance'].forEach(linkId => {
      const a = document.getElementById(linkId);
      if (!a) return;
      const base = a.getAttribute('href').split('?')[0];
      a.href = `${base}?from=staff&store=${id}`;
    });
  }

  initStoreGate();
</script>

</body>
</html>
