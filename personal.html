<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人管理 · 今年貴焿助理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brown-dark:  #2C1A0E;
      --brown-mid:   #5C3317;
      --brown-main:  #8B5E3C;
      --caramel:     #C17B4E;
      --sand:        #D4A574;
      --cream:       #F5EDE0;
      --warm-white:  #FAF7F2;
      --card-bg:     #FFFFFF;
      --text-dark:   #2C1A0E;
      --text-mid:    #6B4C35;
      --text-light:  #9E7B60;
      --green-online:#4CAF7D;
      --border:      #EDE0D0;
    }

    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--warm-white);
      color: var(--text-dark);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 200px; min-width: 200px;
      background: var(--brown-dark);
      display: flex; flex-direction: column;
      padding: 20px 0;
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .avatar-sq {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--caramel), var(--brown-main));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: white; font-weight: 700;
    }
    .brand-text h2 { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .brand-text span { font-size: 11px; color: var(--sand); }

    .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px; cursor: pointer;
      transition: background 0.15s; text-decoration: none;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); }
    .nav-item.active { background: rgba(193,123,78,0.25); border-left: 3px solid var(--caramel); padding-left: 13px; }
    .nav-icon { font-size: 14px; width: 18px; text-align: center; }
    .nav-text { font-size: 12px; color: #fff; }
    .nav-sub  { font-size: 10px; color: var(--text-light); }

    .sidebar-bottom {
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    /* ── Main ── */
    .main { flex: 1; overflow-y: auto; background: var(--warm-white); }

    .main-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 28px 12px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: var(--warm-white); z-index: 10;
    }
    .main-header-left h1 { font-size: 20px; font-weight: 700; color: var(--text-dark); }
    .main-header-left .sync-info { font-size: 12px; color: var(--text-light); margin-top: 2px; }
    .main-header-left .sync-info span { color: var(--text-mid); font-weight: 600; }

    .content { padding: 40px 28px; }

    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; padding: 60px 0; color: var(--text-light); text-align: center;
    }
    .empty-icon { font-size: 36px; opacity: 0.4; }
    .empty-title { font-size: 15px; font-weight: 600; color: var(--text-mid); }
    .empty-sub { font-size: 13px; line-height: 1.7; }

    /* ── Mobile ── */
    .mobile-nav {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--brown-dark); border-top: 1px solid rgba(255,255,255,0.1);
      height: 60px; justify-content: space-around; align-items: center;
      z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .mobile-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      text-decoration: none; color: rgba(255,255,255,0.45); font-size: 10px;
      flex: 1; padding: 6px 4px;
    }
    .mobile-nav-item.active { color: #fff; }
    .mobile-nav-item .mn-icon { font-size: 20px; line-height: 1; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .content { padding-bottom: 80px !important; }
      .mobile-nav { display: flex; }
    }
  </style>
</head>
