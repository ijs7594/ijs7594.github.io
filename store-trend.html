<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>本店經營趨勢 · 今年貴焿助理</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brown-dark:  #2C1A0E;
      --brown-mid:   #5C3317;
      --brown-main:  #8B5E3C;
      --caramel:     #C17B4E;
      --sand:        #D4A574;
      --cream:       #F5EDE0;
      --warm-white:  #FAF7F2;
      --card-bg:     #FFFFFF;
      --text-dark:   #2C1A0E;
      --text-mid:    #6B4C35;
      --text-light:  #9E7B60;
      --border:      #EDE0D0;
      --green:       #4CAF7D;
      --red:         #C0392B;
    }

    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--warm-white);
      color: var(--text-dark);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar { width: 200px; min-width: 200px; background: var(--brown-dark); display: flex; flex-direction: column; padding: 20px 0; }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 0 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .avatar-sq { width: 36px; height: 36px; border-radius: 8px; background: linear-gradient(135deg, var(--caramel), var(--brown-main)); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .brand-text { color: #fff; }
    .brand-name { font-size: 14px; font-weight: 600; }
    .brand-sub  { font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 1px; }
    .nav-list { display: flex; flex-direction: column; gap: 2px; padding: 16px 8px; flex: 1; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: rgba(255,255,255,0.55); font-size: 13px; transition: background 0.15s; }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
    .nav-item.active { background: rgba(255,255,255,0.13); color: #fff; }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-text { font-weight: 500; font-size: 13px; }
    .nav-sub  { font-size: 10px; color: rgba(255,255,255,0.35); }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar-icon { font-size: 22px; }
    .topbar-title { font-size: 18px; font-weight: 700; color: var(--text-dark); }
    .topbar-sub { font-size: 12px; color: var(--text-light); }
    .store-select { margin-left: auto; border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; font-size: 13px; font-family: inherit; outline: none; background: #fff; }
    .store-locked { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--brown-main); padding: 9px 14px; }
    .content { flex: 1; overflow-y: auto; padding: 24px; }

    .month-nav { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    .month-nav button { background: var(--brown-main); color: white; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
    .month-nav button:hover { background: var(--brown-mid); }
    .month-nav h2 { font-size: 18px; color: var(--text-dark); }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 20px; border: 1px solid var(--border); }
    .card-label { font-size: 11px; color: var(--text-light); letter-spacing: 0.5px; margin-bottom: 8px; }
    .card-value { font-size: 26px; font-weight: 700; color: var(--text-dark); }
    .card-value.red { color: var(--red); }
    .card-value.green { color: var(--green); }

    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .chart-box { background: var(--card-bg); border-radius: 14px; padding: 20px; border: 1px solid var(--border); }
    .chart-box h3 { font-size: 13px; color: var(--text-mid); margin-bottom: 14px; }

    .table-box { background: var(--card-bg); border-radius: 14px; padding: 20px; border: 1px solid var(--border); margin-bottom: 16px; }
    .table-box h3 { font-size: 13px; color: var(--text-mid); margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 10px; background: var(--cream); color: var(--text-mid); font-weight: 600; }
    td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; background: var(--cream); color: var(--text-mid); }
    .loading { text-align: center; padding: 32px; color: var(--text-light); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .cards { grid-template-columns: 1fr; }
      .charts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="avatar-sq">🌱</div>
    <div class="brand-text">
      <div class="brand-name">今年貴焿助理</div>
      <div class="brand-sub">貴焿共好系統</div>
    </div>
  </div>
  <div class="nav-list">
    <a class="nav-item" href="staff.html">
      <span class="nav-icon">←</span>
      <div><div class="nav-text">返回夥伴互動入口</div></div>
    </a>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <span class="topbar-icon">📈</span>
    <div>
      <div class="topbar-title">本店經營趨勢</div>
      <div class="topbar-sub" id="last-update">載入中…</div>
    </div>
    <select class="store-select" id="store-select" onchange="onStoreChange()"></select>
    <span class="store-locked" id="store-locked" style="display:none;"></span>
  </div>

  <div class="content">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">◀</button>
      <h2 id="month-label"></h2>
      <button onclick="changeMonth(1)">▶</button>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-label">本月支出</div>
        <div class="card-value red" id="total-expense">—</div>
      </div>
      <div class="card">
        <div class="card-label">本月營業額</div>
        <div class="card-value green" id="total-revenue">—</div>
      </div>
      <div class="card">
        <div class="card-label">記帳筆數</div>
        <div class="card-value" id="total-count">—</div>
      </div>
    </div>

    <div class="charts">
      <div class="chart-box">
        <h3>支出分類</h3>
        <canvas id="categoryChart" height="220"></canvas>
      </div>
      <div class="chart-box">
        <h3>每日營業額趨勢</h3>
        <canvas id="revenueChart" height="220"></canvas>
      </div>
    </div>

    <div class="table-box">
      <h3>支出明細</h3>
      <table>
        <thead><tr><th>日期</th><th>描述</th><th>分類</th><th>金額</th></tr></thead>
        <tbody id="expense-tbody"><tr><td colspan="4" class="loading">載入中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://zsowgiobylacwabjjvub.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzb3dnaW9ieWxhY3dhYmpqdnViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Mzg4NDMsImV4cCI6MjA5OTUxNDg0M30.SvAd1SgRl1oAt4wNTPuXHeiP4omRcFAb-S8DY5EJvEw';

  let stores = [];
  let currentStoreId = null;
  let currentDate = new Date();
  let categoryChart = null;
  let revenueChart = null;

  const CATEGORY_COLORS = { '費用': '#4a2e1a', '變動成本': '#e07b39', '其他': '#aaa' };

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  async function dbGet(table, filters) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${filters}`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    return res.json();
  }

  async function init() {
    stores = await dbGet('stores', 'order=created_at.asc');
    if (!Array.isArray(stores)) stores = [];
    const sel = document.getElementById('store-select');
    sel.innerHTML = stores.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
    const paramStore = new URLSearchParams(location.search).get('store');
    const locked = paramStore && stores.some(s => s.id === paramStore);
    currentStoreId = locked ? paramStore : (stores[0]?.id || null);
    sel.value = currentStoreId;
    if (locked) {
      sel.style.display = 'none';
      const label = document.getElementById('store-locked');
      label.textContent = esc(stores.find(s => s.id === currentStoreId)?.name || '');
      label.style.display = '';
    }
    await loadData();
  }
  init();

  function onStoreChange() {
    currentStoreId = document.getElementById('store-select').value;
    loadData();
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    loadData();
  }

  // 店長回報的「現場營收」是付完當天現金支出後剩下的錢，要把當天所有現金支出（費用＋變動
  // 成本）加回來才是真正營收；月結未付的不能加回去，那筆錢沒從現金裡拿出去過。
  function variableCostForDate(expRows, date) {
    return (expRows || [])
      .filter(e => e.date === date && e.paid !== false)
      .reduce((s, e) => s + Number(e.amount || 0) + Number(e.shipping_amount || 0), 0);
  }
  function calcTotal(r, vc = 0) {
    return (Number(r.morning_revenue) || 0) + (Number(r.evening_revenue) || 0) + (Number(r.line_pay) || 0) + vc
      + (Number(r.uber_amount) || 0) + (Number(r.foodpanda_amount) || 0) + (Number(r.uncollected) || 0);
  }
  function expenseCategory(desc) {
    const m = /^【(.+?)】/.exec(desc || '');
    return m ? m[1] : '其他';
  }

  async function loadData() {
    if (!currentStoreId) return;
    const year = currentDate.getFullYear();
    const month = String(currentDate.getMonth() + 1).padStart(2, '0');
    const start = `${year}-${month}-01`;
    const lastDay = new Date(year, currentDate.getMonth() + 1, 0).getDate();
    const end = `${year}-${month}-${lastDay}`;

    document.getElementById('month-label').textContent = `${year} 年 ${parseInt(month)} 月`;

    const [expenses, reports] = await Promise.all([
      dbGet('store_daily_expenses', `store_id=eq.${currentStoreId}&date=gte.${start}&date=lte.${end}&order=date.desc`),
      dbGet('store_daily_report', `store_id=eq.${currentStoreId}&date=gte.${start}&date=lte.${end}&order=date.asc`)
    ]);
    const expList = Array.isArray(expenses) ? expenses : [];
    const reportList = Array.isArray(reports) ? reports : [];

    const totalExp = expList.reduce((s, e) => s + Number(e.amount || 0) + Number(e.shipping_amount || 0), 0);
    const totalRev = reportList.reduce((s, r) => s + calcTotal(r, variableCostForDate(expList, r.date)), 0);
    document.getElementById('total-expense').textContent = `$${totalExp.toLocaleString()}`;
    document.getElementById('total-revenue').textContent = `$${totalRev.toLocaleString()}`;
    document.getElementById('total-count').textContent = `${expList.length} 筆`;
    document.getElementById('last-update').textContent = `更新於 ${new Date().toLocaleTimeString('zh-TW')}`;

    const catMap = {};
    expList.forEach(e => {
      const cat = expenseCategory(e.description);
      catMap[cat] = (catMap[cat] || 0) + Number(e.amount || 0) + Number(e.shipping_amount || 0);
    });
    const cats = Object.keys(catMap);
    if (categoryChart) categoryChart.destroy();
    categoryChart = new Chart(document.getElementById('categoryChart'), {
      type: 'doughnut',
      data: { labels: cats, datasets: [{ data: cats.map(c => catMap[c]), backgroundColor: cats.map(c => CATEGORY_COLORS[c] || '#aaa') }] },
      options: { plugins: { legend: { position: 'right' } }, cutout: '55%' }
    });

    const revByDay = {};
    reportList.forEach(r => { revByDay[r.date] = calcTotal(r, variableCostForDate(expList, r.date)); });
    const days = Object.keys(revByDay).sort();
    if (revenueChart) revenueChart.destroy();
    revenueChart = new Chart(document.getElementById('revenueChart'), {
      type: 'bar',
      data: { labels: days.map(d => d.slice(5)), datasets: [{ data: days.map(d => revByDay[d]), backgroundColor: '#8b4513', borderRadius: 6 }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });

    const etbody = document.getElementById('expense-tbody');
    etbody.innerHTML = expList.length === 0
      ? '<tr><td colspan="4" class="loading">本月尚無記錄</td></tr>'
      : expList.map(e => `<tr>
          <td>${e.date}</td>
          <td>${esc(e.description) || '—'}</td>
          <td><span class="tag">${esc(expenseCategory(e.description))}</span></td>
          <td>$${(Number(e.amount || 0) + Number(e.shipping_amount || 0)).toLocaleString()}</td>
        </tr>`).join('');
  }
</script>

</body>
</html>
