<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦任務 · 今年貴焿助理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --brown-dark:  #2C1A0E;
      --brown-main:  #8B5E3C;
      --caramel:     #C17B4E;
      --sand:        #D4A574;
      --warm-white:  #FAF7F2;
      --card-bg:     #FFFFFF;
      --text-dark:   #2C1A0E;
      --text-mid:    #6B4C35;
      --text-light:  #9E7B60;
      --border:      #EDE0D0;
      --green:       #4CAF7D;
      --green-lt:    #E8F7F0;
    }
    body {
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--warm-white);
      color: var(--text-dark);
      display: flex; height: 100vh; overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 200px; min-width: 200px;
      background: var(--brown-dark);
      display: flex; flex-direction: column; padding: 20px 0;
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 0 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .avatar-sq {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--caramel), var(--brown-main));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .brand-name { font-size: 14px; font-weight: 600; color: #fff; }
    .brand-sub  { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .nav-list { display: flex; flex-direction: column; gap: 2px; padding: 16px 8px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px; text-decoration: none;
      color: rgba(255,255,255,0.5); font-size: 13px; transition: background 0.15s;
    }
    .nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
    .nav-item.active { background: rgba(255,255,255,0.13); color: #fff; }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .nav-text { font-weight: 500; font-size: 13px; }
    .nav-sub-text { font-size: 10px; color: rgba(255,255,255,0.3); }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Topbar ── */
    .topbar {
      background: var(--card-bg); border-bottom: 1px solid var(--border);
      padding: 14px 24px; display: flex; align-items: center; gap: 12px;
      flex-shrink: 0;
    }
    .topbar-icon { font-size: 22px; }
    .topbar-title { font-size: 17px; font-weight: 700; }
    .topbar-sub { font-size: 12px; color: var(--text-light); margin-top: 1px; }
    .topbar-badge {
      margin-left: auto; font-size: 12px; font-weight: 700;
      padding: 4px 14px; border-radius: 20px;
      background: var(--brown-main); color: #fff;
    }

    /* ── Content ── */
    .content { flex: 1; overflow-y: auto; padding: 24px 28px 40px; }

    /* ── Quick add ── */
    .quick-add {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px; margin-bottom: 24px;
      display: flex; gap: 10px; align-items: center;
    }
    .quick-input {
      flex: 1; padding: 10px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-family: inherit; font-size: 13px;
      color: var(--text-dark); background: var(--warm-white);
      outline: none; transition: border-color 0.15s;
    }
    .quick-input:focus { border-color: var(--brown-main); }
    .quick-btn {
      padding: 10px 22px; background: var(--brown-main); color: #fff;
      border: none; border-radius: 10px; font-family: inherit;
      font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .quick-btn:hover { opacity: 0.85; }
    .quick-hint {
      font-size: 11px; color: var(--text-light);
      padding-top: 10px; border-top: 1px solid var(--border); margin-top: 10px;
    }

    /* ── Tabs ── */
    .tab-row { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-pill {
      padding: 6px 18px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--warm-white); font-family: inherit; font-size: 12px;
      font-weight: 600; color: var(--text-light); cursor: pointer;
    }
    .tab-pill.active { background: var(--brown-main); color: #fff; border-color: var(--brown-main); }

    /* ── Task list ── */
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      background: var(--card-bg); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 16px 18px;
      display: flex; align-items: flex-start; gap: 14px;
      transition: opacity 0.2s;
    }
    .task-item.done { opacity: 0.5; }
    .task-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border); flex-shrink: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin-top: 1px; transition: all 0.15s;
    }
    .task-check:hover { border-color: var(--green); }
    .task-item.done .task-check {
      background: var(--green); border-color: var(--green); color: #fff;
      font-size: 12px;
    }
    .task-body { flex: 1; }
    .task-content {
      font-size: 14px; font-weight: 600; color: var(--text-dark);
      line-height: 1.5; margin-bottom: 6px;
    }
    .task-item.done .task-content { text-decoration: line-through; color: var(--text-light); }
    .task-meta { display: flex; gap: 8px; align-items: center; }
    .task-source {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; background: var(--warm-white);
      color: var(--text-light); border: 1px solid var(--border);
    }
    .task-source.voice { background: #EEF2FF; color: #4338CA; border-color: #C7D2FE; }
    .task-source.text  { background: #F0FDF4; color: #166534; border-color: #BBF7D0; }
    .task-source.web   { background: #FFF7ED; color: #9A3412; border-color: #FED7AA; }
    .task-time { font-size: 10px; color: var(--text-light); }
    .task-empty {
      text-align: center; padding: 48px 20px;
      font-size: 13px; color: var(--text-light);
    }
    .task-empty .big { font-size: 32px; margin-bottom: 10px; }

    /* ── 四象限分類 ── */
    .quad-summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;
      margin-bottom: 22px;
    }
    .quad-card {
      border-radius: 12px; padding: 12px 14px; border: 1.5px solid transparent;
    }
    .quad-card .qc-count { font-size: 20px; font-weight: 800; }
    .quad-card .qc-label { font-size: 11px; font-weight: 700; margin-top: 2px; }
    .quad-card .qc-action { font-size: 10px; opacity: 0.75; margin-top: 4px; }
    .quad-card.q-do        { background: #FEF2F2; border-color: #FECACA; color: #991B1B; }
    .quad-card.q-schedule  { background: #EFF6FF; border-color: #BFDBFE; color: #1E40AF; }
    .quad-card.q-delegate  { background: #FFF7ED; border-color: #FED7AA; color: #9A3412; }
    .quad-card.q-drop      { background: #F3F4F6; border-color: #E5E7EB; color: #4B5563; }

    .quad-group { margin-bottom: 22px; }
    .quad-group-title {
      font-size: 12px; font-weight: 700; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .quad-dot { width: 8px; height: 8px; border-radius: 50%; }
    .quad-dot.q-do       { background: #DC2626; }
    .quad-dot.q-schedule { background: #2563EB; }
    .quad-dot.q-delegate { background: #C2410C; }
    .quad-dot.q-drop     { background: #9CA3AF; }
    .quad-dot.q-unknown  { background: #D4A574; }

    .task-quadrant {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 10px; border: 1px solid;
    }
    .task-quadrant.q-do       { background: #FEF2F2; color: #991B1B; border-color: #FECACA; }
    .task-quadrant.q-schedule { background: #EFF6FF; color: #1E40AF; border-color: #BFDBFE; }
    .task-quadrant.q-delegate { background: #FFF7ED; color: #9A3412; border-color: #FED7AA; }
    .task-quadrant.q-drop     { background: #F3F4F6; color: #4B5563; border-color: #E5E7EB; }
    .task-ai-note { font-size: 11px; color: var(--text-mid); margin-top: 6px; }

    .mobile-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--brown-dark);
      border-top: 1px solid rgba(255,255,255,0.1);
      height: 60px;
      justify-content: space-around; align-items: center;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .mobile-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      text-decoration: none; color: rgba(255,255,255,0.45); font-size: 10px;
      flex: 1; padding: 6px 4px;
    }
    .mobile-nav-item.active { color: #fff; }
    .mobile-nav-item .mn-icon { font-size: 20px; line-height: 1; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .content { padding: 16px 16px 80px; }
      .mobile-nav { display: flex; }
    }
  </style>
</head>
<body>

<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="avatar-sq">🌱</div>
    <div>
      <div class="brand-name">今年貴焿助理</div>
      <div class="brand-sub">貴焿共好系統</div>
    </div>
  </div>
  <div class="nav-list">
    <a class="nav-item" href="index.html">
      <span class="nav-icon">🏠</span>
      <div><div class="nav-text">總覽</div><div class="nav-sub-text">Dashboard</div></div>

    <a class="nav-item" href="sop.html">
      <span class="nav-icon">📖</span>

    <a class="nav-item active" href="inbox.html">
      <span class="nav-icon">📋</span>

    <a class="nav-item" href="scripts.html">
      <span class="nav-icon">✍️</span>

    </a>
    <a class="nav-item" href="liuqiu2026.html">
      <span class="nav-icon">🐢</span>
      <div><div class="nav-text">小琉球</div><div class="nav-sub-text">員工旅遊</div></div>
    </a>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <span class="topbar-icon">📋</span>
    <div>
      <div class="topbar-title">待辦 Inbox</div>
      <div class="topbar-sub">語音說話 → LINE Bot → 自動出現在這裡</div>
    </div>
    <div class="topbar-badge" id="pending-count">載入中…</div>
  </div>

  <div class="content">

    <div class="quick-add">
      <input class="quick-input" id="quick-input" placeholder="快速新增任務…" maxlength="200"
        onkeydown="if(event.key==='Enter') addTask()" />
      <button class="quick-btn" onclick="addTask()">新增</button>
    </div>

    <div class="tab-row">
      <button class="tab-pill active" id="tab-pending" onclick="switchTab('pending')">待辦</button>
      <button class="tab-pill" id="tab-done" onclick="switchTab('done')">已完成</button>
    </div>

    <div class="quad-summary" id="quad-summary"></div>

    <div class="task-list" id="task-list">
      <div class="task-empty"><div class="big">⏳</div>載入中…</div>
    </div>

  </div>
</div>

<nav class="mobile-nav">
  <a class="mobile-nav-item" href="index.html"><span class="mn-icon">🏠</span><span>總覽</span></a>
  <a class="mobile-nav-item" href="sop.html"><span class="mn-icon">📖</span><span>流程</span></a>
  <a class="mobile-nav-item active" href="inbox.html"><span class="mn-icon">📋</span><span>待辦</span></a>
  <a class="mobile-nav-item" href="stores.html"><span class="mn-icon">🏪</span><span>展店</span></a>
  <a class="mobile-nav-item" href="supervision.html"><span class="mn-icon">🔍</span><span>督導</span></a>
</nav>

<script>
  const SB_URL = 'https://zsowgiobylacwabjjvub.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzb3dnaW9ieWxhY3dhYmpqdnViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5Mzg4NDMsImV4cCI6MjA5OTUxNDg0M30.SvAd1SgRl1oAt4wNTPuXHeiP4omRcFAb-S8DY5EJvEw';
  const BOT_URL = 'https://guijong-linebot-production.up.railway.app';
  const BOT_SECRET = '1JslYVY1N9-HE7xvoOMf1SU8rTDMNMLu';

  let currentTab = 'pending';
  let currentTasks = [];

  async function sb(path, opts = {}) {
    const res = await fetch(SB_URL + '/rest/v1/' + path, {
      headers: {
        apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY,
        'Content-Type': 'application/json',
        'Prefer': opts.prefer || 'return=representation',
        ...(opts.headers || {})
      }, ...opts
    });
    return res;
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '剛剛';
    if (diff < 3600000) return Math.floor(diff / 60000) + ' 分鐘前';
    if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小時前';
    return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  function sourceLabel(src) {
    if (src === 'line_voice') return { cls: 'voice', txt: '🎙️ 語音' };
    if (src === 'line_text')  return { cls: 'text',  txt: '✍️ LINE' };
    return { cls: 'web', txt: '🌐 網頁' };
  }

  // 重要／緊急四象限：幫忙決定「抓在自己手上」還是「授權出去」
  const QUADRANTS = [
    { key: '重要緊急',   cls: 'q-do',       action: '親自處理', emoji: '🔴' },
    { key: '重要不緊急', cls: 'q-schedule', action: '排時間做', emoji: '🔵' },
    { key: '緊急不重要', cls: 'q-delegate', action: '授權出去', emoji: '🟠' },
    { key: '不重要不緊急', cls: 'q-drop',   action: '刪除或忽略', emoji: '⚪' },
  ];
  function quadInfo(name) {
    return QUADRANTS.find(q => q.key === name) || null;
  }

  async function loadTasks() {
    const status = currentTab === 'pending' ? 'pending' : 'done';
    const res = await sb(`tasks?status=eq.${status}&order=created_at.desc`);
    if (!res.ok) {
      document.getElementById('task-list').innerHTML = '<div class="task-empty"><div class="big">⚠️</div>請先在 Supabase 建立 tasks 資料表</div>';
      return;
    }
    const data = await res.json();
    currentTasks = data;

    // update badge + 四象限總覽（只在待辦頁顯示，已完成的不用再分心力）
    if (currentTab === 'pending') {
      document.getElementById('pending-count').textContent = data.length + ' 件待辦';
      renderQuadSummary(data);
    } else {
      document.getElementById('quad-summary').innerHTML = '';
    }

    const el = document.getElementById('task-list');
    if (!data.length) {
      el.innerHTML = currentTab === 'pending'
        ? '<div class="task-empty"><div class="big">🎉</div>沒有待辦任務<br>對 LINE Bot 說語音，任務自動出現</div>'
        : '<div class="task-empty"><div class="big">📭</div>還沒有完成的任務</div>';
      return;
    }
    el.innerHTML = currentTab === 'pending'
      ? renderGrouped(data)
      : data.map(renderTaskItem).join('');
  }

  function renderQuadSummary(data) {
    const el = document.getElementById('quad-summary');
    let html = QUADRANTS.map(q => {
      const count = data.filter(t => t.quadrant === q.key).length;
      return `
        <div class="quad-card ${q.cls}">
          <div class="qc-count">${count}</div>
          <div class="qc-label">${q.emoji} ${q.key}</div>
          <div class="qc-action">${q.action}</div>
        </div>
      `;
    }).join('');
    const unclassified = data.filter(t => !quadInfo(t.quadrant)).length;
    if (unclassified) {
      html += `
        <div class="quad-card" style="background:var(--warm-white);border-color:var(--border);color:var(--text-light);">
          <div class="qc-count">${unclassified}</div>
          <div class="qc-label">⏳ 待分類</div>
          <div class="qc-action">AI 判斷中</div>
        </div>
      `;
    }
    el.innerHTML = html;
  }

  function renderGrouped(data) {
    let html = '';
    QUADRANTS.forEach(q => {
      const items = data.filter(t => t.quadrant === q.key);
      if (!items.length) return;
      html += `
        <div class="quad-group">
          <div class="quad-group-title"><span class="quad-dot ${q.cls}"></span>${q.emoji} ${q.key}｜建議${q.action}（${items.length}）</div>
          <div class="task-list">${items.map(renderTaskItem).join('')}</div>
        </div>
      `;
    });
    const unclassified = data.filter(t => !quadInfo(t.quadrant));
    if (unclassified.length) {
      html += `
        <div class="quad-group">
          <div class="quad-group-title"><span class="quad-dot q-unknown"></span>⏳ 待分類（${unclassified.length}）</div>
          <div class="task-list">${unclassified.map(renderTaskItem).join('')}</div>
        </div>
      `;
    }
    return html;
  }

  function renderTaskItem(t) {
    const src = sourceLabel(t.source);
    const isDone = t.status === 'done';
    const quad = quadInfo(t.quadrant);
    const quadBadge = quad ? `<span class="task-quadrant ${quad.cls}">${quad.emoji} ${quad.key}</span>` : '';
    const note = (!isDone && t.ai_note) ? `<div class="task-ai-note">💡 ${escHtml(t.ai_note)}</div>` : '';
    return `
      <div class="task-item${isDone ? ' done' : ''}" id="task-${t.id}">
        <div class="task-check" onclick="toggleDone(${t.id}, '${t.status}')">
          ${isDone ? '✓' : ''}
        </div>
        <div class="task-body">
          <div class="task-content">${escHtml(t.content)}</div>
          <div class="task-meta">
            <span class="task-source ${src.cls}">${src.txt}</span>
            ${quadBadge}
            <span class="task-time">${fmtTime(t.created_at)}</span>
          </div>
          ${note}
        </div>
      </div>
    `;
  }

  async function toggleDone(id, currentStatus) {
    const newStatus = currentStatus === 'pending' ? 'done' : 'pending';
    const body = { status: newStatus };
    if (newStatus === 'done') body.done_at = new Date().toISOString();
    await sb(`tasks?id=eq.${id}`, {
      method: 'PATCH', body: JSON.stringify(body), prefer: 'return=minimal'
    });
    if (newStatus === 'done') notifyTaskCompleted(id);
    await loadTasks();
  }

  // 標記完成時順便讓分身用「每日工事」同一套 AI 判斷歸類，不用另外再輸入一次
  function notifyTaskCompleted(id) {
    const task = currentTasks.find(t => t.id === id);
    if (!task) return;
    fetch(`${BOT_URL}/api/task-completed`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: BOT_SECRET, content: task.content })
    }).catch(() => {});
  }

  async function addTask() {
    const input = document.getElementById('quick-input');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    const res = await sb('tasks', {
      method: 'POST',
      body: JSON.stringify({ content, source: 'web', status: 'pending' })
    });
    try {
      const data = await res.json();
      if (data && data[0]) classifyTask(data[0].id, content);
    } catch {}
    await loadTasks();
  }

  // 網頁快速新增沒有經過 LINE Bot，補打一支 API 讓分身用同一套四象限判斷分類，
  // 分類結果非同步寫回 Supabase，等下一次自動刷新（30秒）就會出現
  function classifyTask(id, content) {
    fetch(`${BOT_URL}/api/classify-task`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: BOT_SECRET, id, content })
    }).catch(() => {});
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-pending').className = 'tab-pill' + (tab === 'pending' ? ' active' : '');
    document.getElementById('tab-done').className   = 'tab-pill' + (tab === 'done'    ? ' active' : '');
    loadTasks();
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadTasks();
  setInterval(loadTasks, 30000); // 每30秒自動更新
</script>
</body>
</html>
